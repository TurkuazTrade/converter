services:
  api:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env.example
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - IDENTITY_SECRET_KEY=dev-change-me-32-byte-secret-key-for-turkuaz-identity
      - IDENTITY_ALGORITHM=HS256
      - STORAGE_ROOT=/data/storage
      - TEMPLATE_PATH=/data/templates/template_zakaz.xlsx
    volumes:
      - ./apps/api:/app
      - ./data:/data
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
    environment:
      - VITE_API_URL=/api/v1
      - VITE_IDENTITY_API_URL=http://localhost:8020/api/v1
      - VITE_PROXY_TARGET=http://api:8000
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
