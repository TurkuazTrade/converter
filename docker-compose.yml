services:
  api:
    build:
      context: ./apps/api
    env_file:
      - ./apps/api/.env.example
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - IDENTITY_API_URL=http://host.docker.internal:8020/api/v1
      - IDENTITY_SECRET_KEY=dev-change-me-32-byte-secret-key-for-turkuaz-identity
      - IDENTITY_ALGORITHM=HS256
      - STORAGE_ROOT=/data/storage
      - TEMPLATE_PATH=/data/templates/template_zakaz.xlsx
    volumes:
      - ./apps/api:/app
      - ./data:/data
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ../..
      dockerfile: converter/web-crm/apps/web/Dockerfile
    environment:
      - VITE_API_URL=/api/v1
      - VITE_PROXY_TARGET=http://api:8000
    volumes:
      - ./apps/web:/workspace/converter/web-crm/apps/web
      - /workspace/converter/web-crm/apps/web/node_modules
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
